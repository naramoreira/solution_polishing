[tool.poetry]
name = "solution_polish"
version = "0.0.1"
description = "Solution polisher algorithm"
authors = [
    "Nara Torres Moreira <naramoreira88@gmail.com>",
]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
ortools = "^9.12"
gurobipy = "^12.0.2"

[tool.poetry.dev-dependencies]
flake8 = "^6.0.0"
pdoc = "^13.1.1"
pylint = "^2.17.4"
pre-commit = "^2.19.0"
black = "^24.10.0"
pydocstyle = "^6.3.0"
mypy = "^1.13.0"
pytest = "^7.2.0"
gurobipy-stubs = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
